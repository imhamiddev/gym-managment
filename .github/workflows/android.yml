name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      - name: Summarize build result on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.build.outcome }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ "$OUTCOME" = "success" ]; then
            body="✅ **Build passed** for \`${SHA:0:7}\` (debug APK compiled)."
          else
            errs=$( (grep -E '^(e|w): |error:|FAILURE|What went wrong|> ' build.log | grep -v '^w: ' | head -80) || true )
            body=$(printf '❌ **Build failed** for `%s`\n\n```\n%s\n```' "${SHA:0:7}" "$errs")
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gymyar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
