name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APKs
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon --console=plain assembleRelease assembleDebug \
            -PappVersionName="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/gymyar-${VERSION}.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/gymyar-${VERSION}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## باشگاه‌یار
            فایل `gymyar-<نسخه>.apk` را دانلود و روی گوشی نصب کنید.
            اگر نسخه‌ی اصلی روی گوشی شما اجرا نشد، نسخه‌ی `-debug` را امتحان کنید.
